<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Arena</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d0e10; color: #eee; font: 15px system-ui, sans-serif; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; width: 100%; height: 100%; }
  #hud { position: fixed; top: 10px; left: 12px; right: 12px; display: flex; justify-content: space-between; pointer-events: none; font-size: 13px; color: #aaa; }
  #board { text-align: right; line-height: 1.5; }
  #best-scores { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); min-width: 220px; padding: 14px 18px; border-radius: 10px; border: 1px solid #444; background: #1c1e22ee; line-height: 1.7; }
  #best-scores h2 { margin: 0 0 6px; font-size: 15px; }
  #best-scores ol { margin: 0; padding-left: 22px; }
  #players, #invite, #color, #best { pointer-events: auto; margin-top: 8px; font: inherit; font-size: 12px; padding: 4px 9px; border-radius: 6px; border: 1px solid #444; background: #1c1e22; color: #ccc; cursor: pointer; }
  #status { position: fixed; inset: 0; display: grid; place-items: center; font-size: 18px; pointer-events: none; }
</style>
</head>
<body>
<canvas id="arena"></canvas>
<div id="hud"><div><div id="help">Move: WASD or arrows · Dash: Space<br>Bump players off the edge</div><button id="invite" type="button">Invite</button> <button id="players" type="button">Players</button> <button id="color" type="button">Color</button> <button id="best" type="button">Best</button></div><div id="board"></div></div>
<div id="status">Connecting…</div>
<div id="best-scores" hidden><h2>Best scores</h2><ol></ol></div>
<script src="_zaisma/v1.js"></script>
<script src="game.js"></script>
</body>
</html>
