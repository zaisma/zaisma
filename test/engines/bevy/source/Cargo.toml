[package]
name = "bevy-sample"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy = { version = "0.20.0", default-features = false, features = ["3d"] }
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
