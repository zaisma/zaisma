# The art review's pictures, made here so no session waits behind another's run on its Mac: for each page asked, the layout check's contact
# sheets (npm run layout:check -- --path <path> --screens all --pictures) and the motion sheet's strips and stills (npm run motion:sheet --
# --path <path> --pictures), on a pull request's head, on the preview with its stand-ins and test data. On a person's machine --pictures
# refuses (localRunRefusal in scripts/layout-check.mjs, picturesRefusal in scripts/motion-sheet.mjs).
#
# Started by npm run pictures -- --pr <number> --path <path> … (scripts/pictures.mjs), which dispatches this on main's copy of it, waits,
# and downloads each job's artifact: sheets/ and layout.txt, or strips/ and motion.txt, and run.json (whether it passed). It's no
# part of "Tests and typecheck", so its time isn't held to CI's 5:00: two runners a page (the sheets, the strips), side by side,
# about a quarter of an hour each (Nov 7, 2026: Home's sheets 15 minutes, its strips 9), at most 60.
name: Pictures
run-name: Pictures for #${{ inputs.pull_request_number }} at ${{ inputs.head_sha }} (${{ inputs.request_id }})

on:
  pull_request:
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: The pull request whose head the pictures are of.
        required: true
      head_sha:
        description: The commit the pictures are of (the pull request's head when it was asked).
        required: true
      page_paths:
        description: 'Each page''s whole path, as a JSON list, like ["/", "/g/cave-crew"].'
        required: true
      request_id:
        description: What npm run pictures finds this run by.
        required: true

permissions:
  contents: read

concurrency:
  # A newer ask for a pull request's pictures replaces one still running.
  group: pictures-${{ inputs.pull_request_number || github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # As check.yml's: the preview's test data as a snapshot.
  PREVIEW_SNAPSHOT_PATHS: |
    .wrangler/preview
    !.wrangler/preview/v3/observability
    !.wrangler/preview/v3/cache
    !.wrangler/preview/*.log

jobs:
  pictures:
    name: Trial ${{ matrix.trial_number }}, ${{ matrix.check_kind == 'layout' && 'Contact sheets' || 'Motion strips' }} of ${{ matrix.page_path }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        page_path: ${{ fromJSON(inputs.page_paths || '["/design/inputs/fields"]') }}
        trial_number: [1, 2, 3]
        # The layout check's sheets and the motion sheet's strips side by side: each takes about a quarter of an hour on a page.
        check_kind: [layout]
    env:
      PAGE_PATH: ${{ matrix.page_path }}
      CHECK_KIND: ${{ matrix.check_kind }}
      HEAD_SHA: ${{ inputs.head_sha || github.event.pull_request.head.sha }}
      PULL_REQUEST_NUMBER: ${{ inputs.pull_request_number || github.event.pull_request.number }}
    steps:
      - shell: bash
        run: |
          case "$HEAD_SHA" in *[!0-9a-f]*|'') echo "head_sha is a commit's 40 hex characters."; exit 1 ;; esac
          [ "${#HEAD_SHA}" -eq 40 ] || { echo "head_sha is a commit's 40 hex characters."; exit 1; }
          case "$PULL_REQUEST_NUMBER" in *[!0-9]*|'') echo "pull_request_number is a whole number."; exit 1 ;; esac
          if ! printf '%s' "$PAGE_PATH" | grep -qE '^/[A-Za-z0-9/_.?&=-]*$'; then echo "Each page path starts with / and holds only letters, digits and / _ . ? & = -."; exit 1; fi
      # Chrome read from the disk, beside what follows, as in check.yml's Layout check.
      - run: |
          (started_sec=$SECONDS; find /opt/google/chrome -type f -exec cat {} + > /dev/null 2>&1; echo "Chrome read from the disk in $((SECONDS - started_sec)) s.") &
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head_sha || github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - uses: actions/cache/restore@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - run: npm ci --no-audit --no-fund
      # The newest snapshot of the preview's test data from these files (check.yml, snapshot-name: the same line), main's or this branch's.
      # Its age doesn't matter here: the preview applies this branch's migrations as it starts.
      - id: snapshot-name
        run: |
          seed_hash="$(git ls-files -s -- scripts/preview examples review-set/listing-cases brand ':!scripts/preview/background.mjs' ':!scripts/preview/memory.mjs' ':!scripts/preview/feedback-*' ':!scripts/preview/bench' ':!scripts/preview/servers.mjs' ':!scripts/preview/seed-snapshot.mjs' | sha256sum | cut -c1-16)"
          echo "prefix=preview-test-data-v1-$seed_hash-" >> "$GITHUB_OUTPUT"
      - id: snapshot
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.PREVIEW_SNAPSHOT_PATHS }}
          key: ${{ steps.snapshot-name.outputs.prefix }}none
          restore-keys: ${{ steps.snapshot-name.outputs.prefix }}
      # No snapshot: the preview makes its test data itself, from the caches Preview test data keeps.
      - if: steps.snapshot.outputs.cache-matched-key == ''
        uses: actions/cache/restore@v4
        with:
          path: .wrangler/preview-migrated
          key: preview-migrated-${{ hashFiles('migrations/**') }}
          restore-keys: preview-migrated-
      - if: steps.snapshot.outputs.cache-matched-key == ''
        uses: actions/cache/restore@v4
        with:
          path: .wrangler/preview-shader-drawings
          key: preview-shader-drawings-${{ hashFiles('packages/cli/shader-check.mjs', 'apps/site/src/shader-check.ts', 'apps/site/src/components/shaders.ts', 'scripts/preview/shaders/**') }}
      - if: steps.snapshot.outputs.cache-matched-key == ''
        uses: actions/cache/restore@v4
        with:
          path: .wrangler/preview-chrome-runs
          key: preview-chrome-runs-${{ hashFiles('apps/site/src/performance-check.ts', 'packages/core/src/performance.ts', 'test/engines/**') }}
      - if: steps.snapshot.outputs.cache-matched-key == ''
        id: miniflare
        run: echo "version=$(node -p "require('miniflare/package.json').version")" >> "$GITHUB_OUTPUT"
      - if: steps.snapshot.outputs.cache-matched-key == ''
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/.wrangler
          key: wrangler-browser-${{ runner.os }}-${{ steps.miniflare.outputs.version }}
      - run: npm run preview:start -- ${{ steps.snapshot.outputs.cache-matched-key == '' && '--reset' || '' }}
      - run: mkdir -p pictures/sheets pictures/strips
      - id: layout
        if: matrix.check_kind == 'layout'
        continue-on-error: true
        shell: bash
        run: npm run layout:check -- --path "$PAGE_PATH" --screens all --pictures pictures/sheets 2>&1 | tee pictures/layout.txt
      - id: motion
        if: matrix.check_kind == 'motion'
        continue-on-error: true
        shell: bash
        run: npm run motion:sheet -- --path "$PAGE_PATH" --pictures pictures/strips 2>&1 | tee pictures/motion.txt
      - if: always()
        env:
          CHECK_OUTCOME: ${{ matrix.check_kind == 'layout' && steps.layout.outcome || steps.motion.outcome }}
        run: |
          node -e 'require("fs").writeFileSync("pictures/run.json", JSON.stringify({ page_path: process.env.PAGE_PATH, head_sha: process.env.HEAD_SHA, pull_request_number: Number(process.env.PULL_REQUEST_NUMBER), check_kind: process.env.CHECK_KIND, check_outcome: process.env.CHECK_OUTCOME || "skipped" }))'
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pictures-${{ strategy.job-index }}
          path: pictures
          retention-days: 7
          compression-level: 1
      - if: (matrix.check_kind == 'layout' && steps.layout.outcome || steps.motion.outcome) != 'success'
        run: |
          echo "The $CHECK_KIND check didn't pass: its output is in this job's artifact ($CHECK_KIND.txt)."
          exit 1
      - if: failure()
        run: tail -n 80 .wrangler/preview-run/preview.log .wrangler/preview/servers.log || true
