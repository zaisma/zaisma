# The nightly layout sweep: every page and state, the stress accounts too, in headless Chrome on the measured screens (MEASURED_SCREEN_NAMES),
# in light (dark changes only colours), at 200% text,
# measuring every rule (npm run layout:check -- --sweep, scripts/layout-check.mjs), on main's preview with its stand-ins and test data. A pull
# request's Layout check measures pages only for how they arrange their pieces on a phone and a laptop (check.yml); this catches what
# that leaves out within a day; the merge queue measures the pages its change reaches the same way (check.yml, "Every screen"), so this is the
# backstop. Each page measured is written with its fingerprint (layout-check.mjs, --measured) to main's cache, so the merge queue skips the
# pages no change reached. "Nightly layout sweep result" passes only when every share did. After a failed one, npm run ship runs this
# workflow itself with commit_sha (the commit it ships) and pages (the pages that failed): a re-check, which measures only those pages, and
# ships once they pass (applyNightlySweep, scripts/ship-github-check.mjs).
name: Nightly layout sweep
# The titles npm run ship tells runs apart by (sweepRunTitle, scripts/ship-github-check.mjs).
run-name: ${{ inputs.commit_sha && format('Layout sweep on {0}{1}', inputs.commit_sha, inputs.pages && ' (re-check)' || '') || 'Nightly layout sweep' }}

on:
  schedule:
    # 02:00 UTC, after an evening's work in Europe.
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "The commit on main to sweep (main's newest when empty)"
        required: false
        default: ""
      pages:
        description: 'Only these pages, a JSON list of names like ["Home", "Sign in"] (every page when empty)'
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  # A re-check of one commit doesn't wait behind the night's sweep.
  group: ${{ inputs.pages && format('layout-recheck-{0}', inputs.commit_sha) || 'nightly-layout-sweep' }}
  cancel-in-progress: false

env:
  # The preview's test data as a snapshot, as in check.yml.
  PREVIEW_SNAPSHOT_PATHS: |
    .wrangler/preview
    !.wrangler/preview/v3/observability
    !.wrangler/preview/v3/cache
    !.wrangler/preview/*.log

jobs:
  # The preview's full test data, made once for the four shares (as check.yml's Preview test data).
  seed:
    name: Preview test data
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha || 'main' }}
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      # The migrations applied to an empty database, kept by their hash (MIGRATED_DATABASES in scripts/preview/run.mjs).
      - uses: actions/cache@v4
        with:
          path: .wrangler/preview-migrated
          key: preview-migrated-${{ hashFiles('migrations/**') }}
      - run: npm ci --no-audit --no-fund
      # The browser miniflare's BROWSER binding downloads (Chrome for Testing, under Wrangler's global cache), kept by miniflare's
      # version so a job never depends on a live download. Its version is pinned in miniflare, so nothing else is looked up.
      - id: miniflare
        run: echo "version=$(node -p "require('miniflare/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: browser-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/.wrangler
          key: wrangler-browser-${{ runner.os }}-${{ steps.miniflare.outputs.version }}
      # On a miss, the browser is fetched with curl and unpacked with unzip (miniflare's own unpacking can stall on a runner) into the folder miniflare
      # looks in, then saved at once, so a job's later failure doesn't lose it. A failure here only leaves miniflare to download it itself.
      - id: browser-install
        if: steps.browser-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          version=$(grep -m1 -oE 'BROWSER_VERSION = "[0-9.]+"' node_modules/miniflare/dist/src/index.js | grep -oE '[0-9.]+')
          directory="$HOME/.cache/.wrangler/chrome/linux-$version"
          curl --fail --silent --show-error --retry 5 --retry-all-errors --connect-timeout 20 --max-time 300 --output "$RUNNER_TEMP/chrome.zip" "https://storage.googleapis.com/chrome-for-testing-public/$version/linux64/chrome-linux64.zip"
          mkdir -p "$directory"
          unzip -q "$RUNNER_TEMP/chrome.zip" -d "$directory"
          test -x "$directory/chrome-linux64/chrome"
      - if: steps.browser-install.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/.wrangler
          key: wrangler-browser-${{ runner.os }}-${{ steps.miniflare.outputs.version }}
      - run: npm run preview:start -- --reset
      # Stopped first, so its databases are written out whole.
      - run: npm run preview:stop
      - uses: actions/cache/save@v4
        with:
          path: ${{ env.PREVIEW_SNAPSHOT_PATHS }}
          key: nightly-preview-test-data-${{ github.run_id }}
      - if: failure()
        run: tail -n 80 .wrangler/preview-run/preview.log .wrangler/preview/servers.log || true

  sweep:
    name: Sweep (${{ matrix.shard }} of 4)
    needs: seed
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha || 'main' }}
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - run: npm ci --no-audit --no-fund
      - uses: actions/cache/restore@v4
        with:
          path: ${{ env.PREVIEW_SNAPSHOT_PATHS }}
          key: nightly-preview-test-data-${{ github.run_id }}
          fail-on-cache-miss: true
      - run: npm run preview:start
      # Main's fingerprints so far, which this sweep adds to (a re-check measures only some pages, and adds nothing).
      - if: ${{ !inputs.pages }}
        uses: actions/cache/restore@v4
        with:
          path: .wrangler/layout-sweep-measured.json
          key: layout-sweep-measured-${{ github.run_id }}
          restore-keys: layout-sweep-measured-
      - env:
          PAGES: ${{ inputs.pages }}
        run: |
          if [ -n "$PAGES" ]; then
            npm run layout:check -- --sweep --shard ${{ matrix.shard }}/4 --pages "$PAGES"
          else
            npm run layout:check -- --sweep --shard ${{ matrix.shard }}/4 --measured .wrangler/layout-sweep-measured.json
          fi
      - if: ${{ always() && !inputs.pages && hashFiles('.wrangler/layout-sweep-measured.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: layout-sweep-measured-${{ matrix.shard }}
          path: .wrangler/layout-sweep-measured.json
      - if: failure()
        run: tail -n 80 .wrangler/preview-run/preview.log .wrangler/preview/servers.log || true

  # The four shares' fingerprints as one, in main's cache, where the merge queue reads them.
  measured:
    name: Measured pages for main
    needs: sweep
    if: ${{ always() && !inputs.pages && needs.sweep.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha || 'main' }}
          sparse-checkout: scripts
      - uses: actions/download-artifact@v4
        with:
          pattern: layout-sweep-measured-*
          path: measured
      - run: node scripts/merge-measured.mjs .wrangler/layout-sweep-measured.json measured
      - uses: actions/cache/save@v4
        with:
          path: .wrangler/layout-sweep-measured.json
          key: layout-sweep-measured-${{ github.run_id }}

  result:
    name: Nightly layout sweep result
    needs: [seed, sweep]
    # Also when a share failed, so the result fails instead of being skipped.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          SEED_RESULT: ${{ needs.seed.result }}
          SWEEP_RESULT: ${{ needs.sweep.result }}
        run: |
          echo "Preview test data: $SEED_RESULT. Sweep: $SWEEP_RESULT."
          if [ "$SEED_RESULT" = success ] && [ "$SWEEP_RESULT" = success ]; then exit 0; fi
          exit 1

  # CI's warning line, 4:00 on the slowest tenth of the last runs (scripts/ci-time-limit.mjs): nothing fails for it, and it pushes Julius while there's
  # room to optimize before the ceiling.
  ci-time:
    name: CI time
    if: ${{ !inputs.pages }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: scripts
      - env:
          GH_TOKEN: ${{ github.token }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
        run: node scripts/ci-time-limit.mjs --report
