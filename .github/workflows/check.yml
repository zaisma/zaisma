# Tests and typecheck on every pull request and every push to main.
# Needs no secrets: vitest.config.ts gives the tests every binding they use.
#
# Everything runs side by side, split across runners: the tests in four shards (four files at once on each), typecheck, the
# Layout check in eight, the Contract grid in three, and the Engine exports in eight, one sample each.
# A run ends within 5:00 of its start, or "Tests and typecheck" fails and names its slowest job (scripts/ci-time-limit.mjs); each job's
# timeout-minutes holds a stuck one, and test/node/ci-time-limit.test.ts holds those limits. The night's "CI time" warns at 4:00.
# "Tests and typecheck", the check the ruleset requires and npm run ship reads, passes only when all of them did.
# The Layout check measures each page for what a player would notice, on a phone and a laptop in light, and every page on every
# screen each night (nightly.yml, "Nightly layout sweep"); a pull request's later pushes skip the pages its earlier ones passed as
# they are. A component's style is held by its tests (design.test.ts, materials.test.ts), never measured. Every screen
# here is the measured screens (MEASURED_SCREEN_NAMES: each band's narrowest, the short one and the widest), in light: dark changes only
# colours. The merge queue measures every page its change reaches on every screen, at 200%
# text, as the night does ("Every screen"), so a layout break can't land on main: a page is reached when its fingerprint (its HTML as
# the server sends it, whose CSS and script addresses carry their change, and the check's own code; layout-check.mjs, pageFingerprint)
# isn't among those main measured already (main's cache, from the night's sweep and each merge's). After a failed night, npm run ship measures its pages again before it deploys
# (applyNightlySweep, scripts/ship-github-check.mjs).
# A pull request runs only the test files its change reaches (scripts/affected-tests.mjs, "Reached tests"), and the test files it
# adds or changes ten times ("New tests ten times"), so a flaky test is caught before the queue. The merge queue and main run every
# test ("Tests"), and only those runs count for npm run ship (scripts/ship-github-check.mjs). In the merge queue a failed file runs
# once more, and a test that passes then is named as flaky instead of throwing the batch out (scripts/test-shard.mjs) (Julius,
# Oct 26, 2026).
# A change to docs/, .claude/, CLAUDE.md or README.md alone changes no code, so it runs only the tests that read
# those files (the node project) as "Docs tests". The same paths are DOCS_ONLY_PATH in
# scripts/ship-github-check.mjs.
# A pull request's commit that only sets the CLI's or game server's version on top of a commit that passed runs as docs do
# (scripts/version-commit.mjs): it changes nothing the check tests, and the merge queue runs everything after it anyway.
# A pull request runs the Engine exports only when its branch changes something they run: the preview's Workers and everything
# they import, its test data and scripts, the samples (scripts/affected-tests.mjs, from the repository's own graph); a push to
# main always runs them. A run that skipped them still passes "Tests and typecheck", and npm run ship counts it only with an
# Engine exports pass on the main commit the pull request was cut from (applyEnginesProof, scripts/ship-github-check.mjs).
# The Contract grid tries every door as every kind of caller (scripts/contract-grid.mjs): anyone can read a run's log, so it prints only what
# a change adds to the commit it left, and nothing of what's failing there too. The merge queue compares with what it merges onto.
# The Pattern rules read Zaisma's own code for risky patterns (scripts/pattern-rules.mjs), and print only what a change adds, for the same reason.
# The Layout check measures pages on the preview's test data, restored from a snapshot made at most a day before from the same
# test data files (main's, or this pull request's own): "Preview test data" makes one first when there's none.
# A pull request's run tests its branch exactly as it is, not merged with main. The merge queue then checks it merged with
# main (and the pull requests ahead of it) as one commit, its merge group, and lands exactly that commit on main, so npm run ship
# counts the merge group's run. A push to main the queue already checked passes on that run and only keeps main's caches for pull
# requests (Caches for main); a push to main that wasn't checked runs everything.
name: Check

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read
  # What changed asks whether a push to main was already checked in the merge queue.
  checks: read
  # Measured pages for main reads the merge group's measured pages.
  actions: read

concurrency:
  group: check-${{ github.ref }}
  # A newer push replaces a pull request's run; every commit on main keeps its own, for npm run ship.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The preview's test data as a snapshot (its servers' logs and traces left out), the same paths wherever it's saved or restored.
  PREVIEW_SNAPSHOT_PATHS: |
    .wrangler/preview
    !.wrangler/preview/v3/observability
    !.wrangler/preview/v3/cache
    !.wrangler/preview/*.log

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      is_code_changed: ${{ steps.diff.outputs.is_code_changed }}
      is_engines_changed: ${{ steps.diff.outputs.is_engines_changed }}
      is_contract_grid_reached: ${{ steps.diff.outputs.is_contract_grid_reached }}
      is_full_suite: ${{ steps.diff.outputs.is_full_suite }}
      reached_test_files: ${{ steps.diff.outputs.reached_test_files }}
      changed_test_files: ${{ steps.diff.outputs.changed_test_files }}
      is_checked_in_queue: ${{ steps.queue.outputs.is_checked_in_queue }}
      preview_snapshot_key: ${{ steps.snapshot.outputs.key }}
      is_preview_snapshot_ready: ${{ steps.snapshot.outputs.is_ready }}
      preview_snapshot_artifact_name: ${{ steps.snapshot.outputs.artifact_name }}
      preview_snapshot_artifact_run_id: ${{ steps.snapshot.outputs.artifact_run_id }}
      repeat_runner_plan: ${{ steps.diff.outputs.repeat_runner_plan }}
      is_migrated_database_cached: ${{ steps.migrated-lookup.outputs.cache-hit }}
      is_browser_cached: ${{ steps.browser-lookup.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      # A push to main from the merge queue is the very commit its merge group checked: a passed "Tests and typecheck" on this
      # commit (its merge group's, or an earlier run's) stands for it.
      - id: queue
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          # Asked up to three times; when GitHub doesn't answer, this run checks everything itself.
          passed_count=0
          for try_number in 1 2 3; do
            if passed_count="$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/check-runs?check_name=Tests%20and%20typecheck&filter=all&per_page=100" --jq '[.check_runs[] | select(.status == "completed" and .conclusion == "success")] | length')"; then break; fi
            passed_count=0
            sleep 5
          done
          if [ "$passed_count" -gt 0 ]; then
            echo "This commit's code already passed the full check in the merge queue: this run only keeps main's caches."
            echo "is_checked_in_queue=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_checked_in_queue=false" >> "$GITHUB_OUTPUT"
          fi
      - id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
          # A pull request: what its branch changed since it left main. A merge group or a push: what it adds to main.
          RANGE_DOTS: ${{ github.event_name == 'pull_request' && '...' || '..' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "No earlier commit to compare with: running everything."
            echo "is_code_changed=true" >> "$GITHUB_OUTPUT"
            echo "is_engines_changed=true" >> "$GITHUB_OUTPUT"
            echo "is_contract_grid_reached=true" >> "$GITHUB_OUTPUT"
            echo "is_full_suite=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed_paths="$(git diff --name-only "$BASE_SHA$RANGE_DOTS$HEAD_SHA")"
          echo "$changed_paths"
          # Whether the Engine exports run (always on main, and on a pull request when the change reaches what they run) and which
          # tests a pull request runs, by the repository's graph (scripts/affected-tests.mjs: plain Node, before npm ci).
          node scripts/affected-tests.mjs --github
          if [ -n "$changed_paths" ] && ! echo "$changed_paths" | grep -qvE '^(docs/|\.claude/|CLAUDE\.md$|README\.md$)'; then
            echo "Only docs/, .claude/, CLAUDE.md and README.md changed: running the docs tests."
            echo "is_code_changed=false" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = pull_request ] && [ "$(node scripts/version-commit.mjs "$HEAD_SHA")" = true ]; then
            echo "This commit only sets a package's version on a commit that passed: running the docs tests. The merge queue runs everything."
            echo "is_code_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_code_changed=true" >> "$GITHUB_OUTPUT"
          fi
      # The Layout check's test data: a snapshot made from the files that make it as they are (the preview's seed, stand-ins and
      # Workers, and what it uploads; not how it starts, its memory line, its feedback overlay or the Screens bench), by main or this pull
      # request, at most 20 hours before. The key ends in when it was made. A merge group can't read a pull request's cache, so it also
      # looks for the artifact the pull request's Preview test data left: the same files made it, on a branch of this repository.
      - id: snapshot-name
        run: |
          seed_hash="$(git ls-files -s -- scripts/preview examples review-set/listing-cases brand ':!scripts/preview/background.mjs' ':!scripts/preview/memory.mjs' ':!scripts/preview/feedback-*' ':!scripts/preview/bench' ':!scripts/preview/servers.mjs' ':!scripts/preview/seed-snapshot.mjs' | sha256sum | cut -c1-16)"
          echo "prefix=preview-test-data-v1-$seed_hash-" >> "$GITHUB_OUTPUT"
          echo "now_sec=$(date +%s)" >> "$GITHUB_OUTPUT"
      - id: snapshot-lookup
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.PREVIEW_SNAPSHOT_PATHS }}
          key: ${{ steps.snapshot-name.outputs.prefix }}${{ steps.snapshot-name.outputs.now_sec }}
          restore-keys: ${{ steps.snapshot-name.outputs.prefix }}
          lookup-only: true
      - id: snapshot
        env:
          PREFIX: ${{ steps.snapshot-name.outputs.prefix }}
          NOW_SEC: ${{ steps.snapshot-name.outputs.now_sec }}
          MATCHED_KEY: ${{ steps.snapshot-lookup.outputs.cache-matched-key }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          EVENT_NAME=merge_group
          MATCHED_KEY=""
          made_at_sec="${MATCHED_KEY#"$PREFIX"}"
          if [ -n "$MATCHED_KEY" ] && [ $((NOW_SEC - made_at_sec)) -lt 72000 ]; then
            echo "The preview's test data is ready: $MATCHED_KEY."
            echo "key=$MATCHED_KEY" >> "$GITHUB_OUTPUT"
            echo "is_ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "key=$PREFIX$NOW_SEC" >> "$GITHUB_OUTPUT"
          artifact_run_id=""
          if [ "$EVENT_NAME" = merge_group ]; then
            # The artifact is named by its snapshot's key, which ends in when the test data was made: the caches of every branch
            # name those keys (newest first), so the 20 hours count from the making, however late a pull request handed it on.
            made_keys="$(gh api "repos/$GITHUB_REPOSITORY/actions/caches?key=$PREFIX&sort=created_at&direction=desc&per_page=30" --jq ".actions_caches[].key" || true)"
            for made_key in $made_keys; do
              made_at_sec="${made_key#"$PREFIX"}"
              case "$made_at_sec" in ''|*[!0-9]*) continue ;; esac
              [ $((NOW_SEC - made_at_sec)) -lt 72000 ] || continue
              artifact_run_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$made_key&per_page=30" --jq "[.artifacts[] | select(.expired | not) | select(.workflow_run.head_repository_id == .workflow_run.repository_id)] | sort_by(.created_at) | last | .workflow_run.id // empty" || true)"
              if [ -n "$artifact_run_id" ]; then
                artifact_name="$made_key"
                break
              fi
            done
          fi
          if [ -n "$artifact_run_id" ]; then
            echo "The preview's test data is ready: the snapshot $artifact_name, which its pull request's run $artifact_run_id handed on."
            echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
            echo "artifact_run_id=$artifact_run_id" >> "$GITHUB_OUTPUT"
            echo "is_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "No snapshot of the preview's test data from these files in the last 20 hours: Preview test data makes one."
            echo "is_ready=false" >> "$GITHUB_OUTPUT"
          fi
      # Whether main's cache has the migrations applied to an empty database (MIGRATED_DATABASES in scripts/preview/run.mjs).
      - id: migrated-lookup
        uses: actions/cache/restore@v4
        with:
          path: .wrangler/preview-migrated
          key: preview-migrated-${{ hashFiles('migrations/**') }}
          lookup-only: true
      # Whether main's cache has the Workers browser (the tests and engines jobs restore it), under miniflare's version from the lockfile.
      - id: browser-version
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/miniflare'].version")" >> "$GITHUB_OUTPUT"
      - id: browser-lookup
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/.wrangler
          key: wrangler-browser-${{ runner.os }}-${{ steps.browser-version.outputs.version }}
          lookup-only: true

  tests:
    # "Reached tests" on a pull request that runs only the tests its change reaches, which npm run ship never counts.
    name: ${{ needs.changes.outputs.is_full_suite == 'true' && 'Tests' || 'Reached tests' }} (${{ matrix.shard }} of 4)
    needs: changes
    if: needs.changes.outputs.is_code_changed == 'true' && needs.changes.outputs.is_checked_in_queue != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    strategy:
      # Every shard finishes, so a failure shows all its failing tests at once.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      # npm's download cache: falls back to the newest one when package-lock.json changed, so a workspace's version
      # bump downloads nothing and a dependency's change downloads only that dependency.
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - run: npm ci --no-audit --no-fund
      # The browser miniflare's BROWSER binding downloads (Chrome for Testing, under Wrangler's global cache), kept by miniflare's
      # version so a job never depends on a live download. Its version is pinned in miniflare, so nothing else is looked up.
      - id: miniflare
        run: echo "version=$(node -p "require('miniflare/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: browser-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/.wrangler
          key: wrangler-browser-${{ runner.os }}-${{ steps.miniflare.outputs.version }}
      # On a miss, the browser is fetched with curl and unpacked with unzip (miniflare's own unpacking can stall on a runner) into the folder miniflare
      # looks in, then saved at once, so a job's later failure doesn't lose it. A failure here only leaves miniflare to download it itself.
      - id: browser-install
        if: steps.browser-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          version=$(grep -m1 -oE 'BROWSER_VERSION = "[0-9.]+"' node_modules/miniflare/dist/src/index.js | grep -oE '[0-9.]+')
          directory="$HOME/.cache/.wrangler/chrome/linux-$version"
          curl --fail --silent --show-error --retry 5 --retry-all-errors --connect-timeout 20 --max-time 300 --output "$RUNNER_TEMP/chrome.zip" "https://storage.googleapis.com/chrome-for-testing-public/$version/linux64/chrome-linux64.zip"
          mkdir -p "$directory"
          unzip -q "$RUNNER_TEMP/chrome.zip" -d "$directory"
          test -x "$directory/chrome-linux64/chrome"
      - if: steps.browser-install.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/.wrangler
          key: wrangler-browser-${{ runner.os }}-${{ steps.miniflare.outputs.version }}
      # The fast lane's WebTransport packages are an optional peer of the game server, which npm ci leaves out:
      # installed here, at the versions it names, so the runner's fast-lane tests run instead of skipping.
      - run: npm install --no-save --no-audit --no-fund $(node -p "Object.entries(require('./packages/game-server/package.json').peerDependencies).map(([name, version]) => name + '@' + version).join(' ')")
      # Miniflare keeps the tests' databases, buckets and rate limiters in SQLite files under the temp folder, and
      # syncs each write: in memory, a slow runner disk can't hold a test past its time. Four files at once, one a core.
      - run: node scripts/test-shard.mjs --shard ${{ matrix.shard }}/4 ${{ needs.changes.outputs.is_full_suite != 'true' && '--files "$REACHED_TEST_FILES"' || '' }} ${{ github.event_name == 'merge_group' && '--rerun-failed-once' || '' }}
        env:
          TMPDIR: /dev/shm
          TEST_WORKER_COUNT: 4
          REACHED_TEST_FILES: ${{ needs.changes.outputs.reached_test_files }}
      - if: always() && hashFiles('flaky_tests.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: flaky-tests-${{ matrix.shard }}
          path: flaky_tests.json

  # The test files a pull request adds or changes, ten runs shared across as many runners as keep it short (repeatRunnerPlan,
  # scripts/affected-tests.mjs): most flaky tests show before the merge queue.
  # rerun.yml's fifty runs stay for proving a flaky test's fix.
  repeat-new-tests:
    name: New tests ten times (${{ matrix.runner }} of ${{ matrix.runner_count }})
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.is_code_changed == 'true' && needs.changes.outputs.changed_test_files != ''
    runs-on: ubuntu-latest
    timeout-minutes: 4
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.repeat_runner_plan) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      # npm's download cache, as in the tests job.
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - run: npm ci --no-audit --no-fund
      # The browser miniflare's BROWSER binding downloads (Chrome for Testing, under Wrangler's global cache), kept by miniflare's
      # version so a job never depends on a live download. Its version is pinned in miniflare, so nothing else is looked up.
      - id: miniflare
        run: echo "version=$(node -p "require('miniflare/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: browser-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/.wrangler
          key: wrangler-browser-${{ runner.os }}-${{ steps.miniflare.outputs.version }}
      # On a miss, the browser is fetched with curl and unpacked with unzip (miniflare's own unpacking can stall on a runner) into the folder miniflare
      # looks in, then saved at once, so a job's later failure doesn't lose it. A failure here only leaves miniflare to download it itself.
      - id: browser-install
        if: steps.browser-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          version=$(grep -m1 -oE 'BROWSER_VERSION = "[0-9.]+"' node_modules/miniflare/dist/src/index.js | grep -oE '[0-9.]+')
          directory="$HOME/.cache/.wrangler/chrome/linux-$version"
          curl --fail --silent --show-error --retry 5 --retry-all-errors --connect-timeout 20 --max-time 300 --output "$RUNNER_TEMP/chrome.zip" "https://storage.googleapis.com/chrome-for-testing-public/$version/linux64/chrome-linux64.zip"
          mkdir -p "$directory"
          unzip -q "$RUNNER_TEMP/chrome.zip" -d "$directory"
          test -x "$directory/chrome-linux64/chrome"
      - if: steps.browser-install.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/.wrangler
          key: wrangler-browser-${{ runner.os }}-${{ steps.miniflare.outputs.version }}
      # The fast lane's WebTransport packages are an optional peer of the game server, which npm ci leaves out:
      # installed here, at the versions it names, so the runner's fast-lane tests run instead of skipping.
      - run: npm install --no-save --no-audit --no-fund $(node -p "Object.entries(require('./packages/game-server/package.json').peerDependencies).map(([name, version]) => name + '@' + version).join(' ')")
      - env:
          CHANGED_TEST_FILES: ${{ needs.changes.outputs.changed_test_files }}
          RUN_COUNT: ${{ matrix.run_count }}
          # As in the tests job.
          TMPDIR: /dev/shm
          TEST_WORKER_COUNT: 4
        run: |
          for run in $(seq 1 "$RUN_COUNT"); do
            echo "::group::Run $run of $RUN_COUNT on this runner"
            if ! npx vitest run $CHANGED_TEST_FILES; then echo "::error::A run on this runner failed: a test this pull request adds or changes is flaky or failing."; exit 1; fi
            echo "::endgroup::"
          done

  typecheck:
    name: Typecheck
    needs: changes
    if: needs.changes.outputs.is_code_changed == 'true' && needs.changes.outputs.is_checked_in_queue != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      # npm's download cache, as in the tests job.
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck

  # Every door tried by every kind of caller (docs/DOORS.md), compared with what the change left: anyone can read this log, so it says
  # only what this change adds (scripts/contract-grid.mjs). A push to main isn't compared: the merge queue compared that very commit.
  contract-grid:
    name: Contract grid (${{ matrix.part }})
    needs: changes
    if: needs.changes.outputs.is_code_changed == 'true' && needs.changes.outputs.is_contract_grid_reached == 'true' && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    strategy:
      fail-fast: false
      matrix:
        part: [pages, api, other]
    env:
      TEST_WORKER_COUNT: 4
      ZAISMA_CONTRACT_GRID_PART: ${{ matrix.part }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      # npm's download cache, as in the tests job.
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - run: npm ci --no-audit --no-fund
      # What the change left: for a pull request where its branch left main, so what main fixed since isn't taken for this change's.
      - env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: node scripts/contract-grid.mjs --compare "$(git merge-base "$BASE_SHA" HEAD)"

  # Risky patterns in Zaisma's own code (docs/PATTERN-RULES.md), compared with what the change left: anyone can read this log, so it says only
  # what this change adds (scripts/pattern-rules.mjs). A push to main isn't compared: the merge queue compared that very commit.
  pattern-rules:
    name: Pattern rules
    needs: changes
    if: needs.changes.outputs.is_code_changed == 'true' && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      # npm's download cache, as in the tests job.
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - run: npm ci --no-audit --no-fund
      # What the change left: for a pull request where its branch left main, so what main fixed since isn't taken for this change's.
      - env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: node scripts/pattern-rules.mjs --compare "$(git merge-base "$BASE_SHA" HEAD)"

  # The engine samples (test/engines) through the real upload command, scan and game page, on the preview with its stand-ins
  # (seeded with only the samples), played in headless Chrome (scripts/engines/play.mjs): each runner takes its share of the
  # samples (ENGINE_SAMPLE_SHARD, scripts/engines/samples.mjs).
  engines:
    name: Engine exports (${{ matrix.shard }} of 8)
    needs: changes
    if: needs.changes.outputs.is_code_changed == 'true' && needs.changes.outputs.is_engines_changed == 'true' && needs.changes.outputs.is_checked_in_queue != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      ENGINE_SAMPLE_SHARD: ${{ matrix.shard }}/8
    steps:
      # Chrome read from the disk, beside what follows: on a fresh runner its first read can take minutes, and the run that needs it waits on it.
      - run: |
          (started_sec=$SECONDS; find /opt/google/chrome -type f -exec cat {} + > /dev/null 2>&1; echo "Chrome read from the disk in $((SECONDS - started_sec)) s.") &
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      # npm's download cache, as in the tests job.
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      # The migrations applied to an empty database, kept by their hash (MIGRATED_DATABASES in scripts/preview/run.mjs).
      - uses: actions/cache@v4
        with:
          path: .wrangler/preview-migrated
          key: preview-migrated-${{ hashFiles('migrations/**') }}
          restore-keys: preview-migrated-
      - run: npm ci --no-audit --no-fund
      # The browser miniflare's BROWSER binding downloads (Chrome for Testing, under Wrangler's global cache), kept by miniflare's
      # version so a job never depends on a live download. Its version is pinned in miniflare, so nothing else is looked up.
      - id: miniflare
        run: echo "version=$(node -p "require('miniflare/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: browser-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/.wrangler
          key: wrangler-browser-${{ runner.os }}-${{ steps.miniflare.outputs.version }}
      # On a miss, the browser is fetched with curl and unpacked with unzip (miniflare's own unpacking can stall on a runner) into the folder miniflare
      # looks in, then saved at once, so a job's later failure doesn't lose it. A failure here only leaves miniflare to download it itself.
      - id: browser-install
        if: steps.browser-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          version=$(grep -m1 -oE 'BROWSER_VERSION = "[0-9.]+"' node_modules/miniflare/dist/src/index.js | grep -oE '[0-9.]+')
          directory="$HOME/.cache/.wrangler/chrome/linux-$version"
          curl --fail --silent --show-error --retry 5 --retry-all-errors --connect-timeout 20 --max-time 300 --output "$RUNNER_TEMP/chrome.zip" "https://storage.googleapis.com/chrome-for-testing-public/$version/linux64/chrome-linux64.zip"
          mkdir -p "$directory"
          unzip -q "$RUNNER_TEMP/chrome.zip" -d "$directory"
          test -x "$directory/chrome-linux64/chrome"
      - if: steps.browser-install.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/.wrangler
          key: wrangler-browser-${{ runner.os }}-${{ steps.miniflare.outputs.version }}
      - run: npm run preview:start -- --reset --engines-only
      - run: npm run engines:play
      - if: failure()
        run: tail -n 80 .wrangler/preview-run/preview.log .wrangler/preview/servers.log || true
      - if: failure()
        run: |
          grep -ihE "browser|chrome" .wrangler/preview-run/preview.log .wrangler/preview/servers.log | head -n 40 || true
          find ~/.cache/.wrangler -maxdepth 4 2>/dev/null | head -n 20 || true

  # The preview's full test data, made once when there's no snapshot of it from the same files (What changed), for the Layout check.
  seed:
    name: Preview test data
    needs: changes
    if: needs.changes.outputs.is_code_changed == 'true' && needs.changes.outputs.is_preview_snapshot_ready == 'false' && needs.changes.outputs.is_checked_in_queue != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      # npm's download cache, as in the tests job.
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      # The migrations applied to an empty database, as in the engines job.
      - uses: actions/cache@v4
        with:
          path: .wrangler/preview-migrated
          key: preview-migrated-${{ hashFiles('migrations/**') }}
          restore-keys: preview-migrated-
      # The shaders' drawings (SHADER_DRAWINGS in scripts/preview/run.mjs), kept by what makes them.
      - uses: actions/cache@v4
        with:
          path: .wrangler/preview-shader-drawings
          key: preview-shader-drawings-${{ hashFiles('packages/cli/shader-check.mjs', 'apps/site/src/shader-check.ts', 'apps/site/src/components/shaders.ts', 'scripts/preview/shaders/**') }}
      # The games' runs in Chrome (SEED_CHROME_RUNS in scripts/preview/run.mjs), kept by what makes them.
      - uses: actions/cache@v4
        with:
          path: .wrangler/preview-chrome-runs
          key: preview-chrome-runs-${{ hashFiles('apps/site/src/performance-check.ts', 'packages/core/src/performance.ts', 'test/engines/**') }}
      - run: npm ci --no-audit --no-fund
      # The browser miniflare's BROWSER binding downloads (Chrome for Testing, under Wrangler's global cache), kept by miniflare's
      # version so a job never depends on a live download. Its version is pinned in miniflare, so nothing else is looked up.
      - id: miniflare
        run: echo "version=$(node -p "require('miniflare/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: browser-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/.wrangler
          key: wrangler-browser-${{ runner.os }}-${{ steps.miniflare.outputs.version }}
      # On a miss, the browser is fetched with curl and unpacked with unzip (miniflare's own unpacking can stall on a runner) into the folder miniflare
      # looks in, then saved at once, so a job's later failure doesn't lose it. A failure here only leaves miniflare to download it itself.
      - id: browser-install
        if: steps.browser-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          version=$(grep -m1 -oE 'BROWSER_VERSION = "[0-9.]+"' node_modules/miniflare/dist/src/index.js | grep -oE '[0-9.]+')
          directory="$HOME/.cache/.wrangler/chrome/linux-$version"
          curl --fail --silent --show-error --retry 5 --retry-all-errors --connect-timeout 20 --max-time 300 --output "$RUNNER_TEMP/chrome.zip" "https://storage.googleapis.com/chrome-for-testing-public/$version/linux64/chrome-linux64.zip"
          mkdir -p "$directory"
          unzip -q "$RUNNER_TEMP/chrome.zip" -d "$directory"
          test -x "$directory/chrome-linux64/chrome"
      - if: steps.browser-install.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/.wrangler
          key: wrangler-browser-${{ runner.os }}-${{ steps.miniflare.outputs.version }}
      - run: npm run preview:start -- --reset
      # Stopped first, so its databases are written out whole.
      - run: npm run preview:stop
      - uses: actions/cache/save@v4
        with:
          path: ${{ env.PREVIEW_SNAPSHOT_PATHS }}
          key: ${{ needs.changes.outputs.preview_snapshot_key }}
      # For this pull request's merge group, which can't read this branch's cache (What changed), named by the snapshot's key. A day
      # is past the 20 hours a snapshot is used.
      - if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.changes.outputs.preview_snapshot_key }}
          path: ${{ env.PREVIEW_SNAPSHOT_PATHS }}
          include-hidden-files: true
          retention-days: 1
          compression-level: 1
      - if: failure()
        run: tail -n 80 .wrangler/preview-run/preview.log .wrangler/preview/servers.log || true

  # The measuring check as a pull request runs it (npm run layout:check): every page and state in headless Chrome on a phone and a laptop,
  # in light, for how it arranges its pieces, eight runners sharing the pages by cost, and the pages broken on purpose on the first two,
  # on the preview with its stand-ins and test data
  # (test/layout/layout-check.test.ts). The preview starts from the snapshot in seconds and applies this branch's own migrations, as it
  # does on any start.
  layout:
    name: Layout check (${{ matrix.shard }} of 8)
    needs: [changes, seed]
    if: ${{ !cancelled() && needs.changes.outputs.is_code_changed == 'true' && needs.changes.outputs.is_checked_in_queue != 'true' && (needs.seed.result == 'success' || needs.seed.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      # Chrome read from the disk, beside what follows: on a fresh runner its first read can take minutes, and the run that needs it waits on it.
      - run: |
          (started_sec=$SECONDS; find /opt/google/chrome -type f -exec cat {} + > /dev/null 2>&1; echo "Chrome read from the disk in $((SECONDS - started_sec)) s.") &
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      # npm's download cache, as in the tests job.
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - run: npm ci --no-audit --no-fund
      - if: needs.changes.outputs.preview_snapshot_artifact_run_id == ''
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.PREVIEW_SNAPSHOT_PATHS }}
          key: ${{ needs.changes.outputs.preview_snapshot_key }}
          fail-on-cache-miss: true
      - if: needs.changes.outputs.preview_snapshot_artifact_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.changes.outputs.preview_snapshot_artifact_name }}
          path: .wrangler/preview
          run-id: ${{ needs.changes.outputs.preview_snapshot_artifact_run_id }}
          github-token: ${{ github.token }}
      # A pull request that found its snapshot in the cache left no artifact of it (Preview test data skipped), and its merge group
      # can't read this branch's cache: without one, the queue makes the test data again before its Layout check and Every screen
      # start, and a run that reaches pages passes 5:00. So the first share hands the snapshot on as Preview test data does,
      # before the preview starts and changes it.
      - if: github.event_name == 'pull_request' && matrix.shard == 1 && needs.seed.result == 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.changes.outputs.preview_snapshot_key }}
          path: ${{ env.PREVIEW_SNAPSHOT_PATHS }}
          include-hidden-files: true
          retention-days: 1
          compression-level: 1
          overwrite: true
      - run: npm run preview:start
      # The pages this pull request's earlier runs passed, by fingerprint, which this run skips as they are (layout-check.test.ts,
      # PASSED_PATH). The merge queue's and main's runs measure every page (LAYOUT_CHECK_FRESH), so a cached pass never stands in for main.
      - uses: actions/cache/restore@v4
        with:
          path: .wrangler/layout-check-passed.json
          key: layout-passed-${{ matrix.shard }}-${{ github.sha }}
          restore-keys: layout-passed-${{ matrix.shard }}-
      - run: npx vitest run --project layout
        env:
          LAYOUT_CHECK: "1"
          LAYOUT_CHECK_SHARD: ${{ matrix.shard }}/8
          LAYOUT_CHECK_FRESH: "1"
      # Saved when a page failed too: only passes are in it, so the next push measures the failed page and skips the rest.
      - if: ${{ always() && github.event_name == 'pull_request' && hashFiles('.wrangler/layout-check-passed.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: .wrangler/layout-check-passed.json
          key: layout-passed-${{ matrix.shard }}-${{ github.sha }}-${{ github.run_attempt }}
      - if: failure()
        run: tail -n 80 .wrangler/preview-run/preview.log .wrangler/preview/servers.log || true

  # The merge queue's sweep: every page and state the change reaches, the stress accounts too, on the measured screens, in light, at 200% text,
  # every rule (npm run layout:check -- --sweep), skipping the pages whose fingerprint main measured already (--changed-only, from main's
  # cache). A page that sends forms or opens a hidden state is always measured. Each share's measured pages go up for Measured pages for
  # main, once this commit is main.
  sweep:
    name: Every screen (${{ matrix.shard }} of 6)
    needs: [changes, seed]
    if: ${{ !cancelled() && needs.changes.outputs.is_code_changed == 'true' && needs.changes.outputs.is_checked_in_queue != 'true' && (needs.seed.result == 'success' || needs.seed.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      # Chrome read from the disk, beside what follows: on a fresh runner its first read can take minutes, and the run that needs it waits on it.
      - run: |
          (started_sec=$SECONDS; find /opt/google/chrome -type f -exec cat {} + > /dev/null 2>&1; echo "Chrome read from the disk in $((SECONDS - started_sec)) s.") &
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      # npm's download cache, as in the tests job.
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - run: npm ci --no-audit --no-fund
      - if: needs.changes.outputs.preview_snapshot_artifact_run_id == ''
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.PREVIEW_SNAPSHOT_PATHS }}
          key: ${{ needs.changes.outputs.preview_snapshot_key }}
          fail-on-cache-miss: true
      - if: needs.changes.outputs.preview_snapshot_artifact_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.changes.outputs.preview_snapshot_artifact_name }}
          path: .wrangler/preview
          run-id: ${{ needs.changes.outputs.preview_snapshot_artifact_run_id }}
          github-token: ${{ github.token }}
      # Main's measured pages: the newest from the night's sweep or a merge's (nightly.yml and Measured pages for main).
      - uses: actions/cache/restore@v4
        with:
          path: .wrangler/layout-sweep-measured.json
          key: layout-sweep-measured-${{ github.sha }}
          restore-keys: layout-sweep-measured-
      - run: npm run preview:start
      - run: npm run layout:check -- --sweep --shard ${{ matrix.shard }}/6 --measured .wrangler/layout-sweep-measured.json --changed-only
      - if: success()
        uses: actions/upload-artifact@v4
        with:
          name: layout-sweep-measured-${{ matrix.shard }}
          path: .wrangler/layout-sweep-measured.json
      - if: failure()
        run: tail -n 80 .wrangler/preview-run/preview.log .wrangler/preview/servers.log || true

  docs-tests:
    name: Docs tests
    needs: changes
    if: needs.changes.outputs.is_code_changed == 'false' && needs.changes.outputs.is_checked_in_queue != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      # npm's download cache, as in the tests job.
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - run: npm ci --no-audit --no-fund
      - run: npm test -- --project node
        env:
          TMPDIR: /dev/shm
          TEST_WORKER_COUNT: 4

  # Main's caches, which pull requests read (a branch's run can read main's caches, never another branch's): the preview's test data
  # snapshot and the migrated database, made here when a push the merge queue already checked brings new seed files or migrations,
  # or a day has passed. Nothing waits for it.
  main-caches:
    name: Caches for main
    needs: changes
    if: github.event_name == 'push' && needs.changes.outputs.is_checked_in_queue == 'true' && (needs.changes.outputs.is_preview_snapshot_ready == 'false' || needs.changes.outputs.is_migrated_database_cached != 'true' || needs.changes.outputs.is_browser_cached != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      # npm's download cache, as in the tests job.
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      # The migrations applied to an empty database, as in the engines job: saved here when it's new.
      - uses: actions/cache@v4
        with:
          path: .wrangler/preview-migrated
          key: preview-migrated-${{ hashFiles('migrations/**') }}
          restore-keys: preview-migrated-
      # The shaders' drawings (SHADER_DRAWINGS in scripts/preview/run.mjs), kept by what makes them.
      - uses: actions/cache@v4
        with:
          path: .wrangler/preview-shader-drawings
          key: preview-shader-drawings-${{ hashFiles('packages/cli/shader-check.mjs', 'apps/site/src/shader-check.ts', 'apps/site/src/components/shaders.ts', 'scripts/preview/shaders/**') }}
      # The games' runs in Chrome (SEED_CHROME_RUNS in scripts/preview/run.mjs), kept by what makes them.
      - uses: actions/cache@v4
        with:
          path: .wrangler/preview-chrome-runs
          key: preview-chrome-runs-${{ hashFiles('apps/site/src/performance-check.ts', 'packages/core/src/performance.ts', 'test/engines/**') }}
      - run: npm ci --no-audit --no-fund
      # The browser miniflare's BROWSER binding downloads (Chrome for Testing, under Wrangler's global cache), kept by miniflare's
      # version so a job never depends on a live download. Its version is pinned in miniflare, so nothing else is looked up.
      - id: miniflare
        run: echo "version=$(node -p "require('miniflare/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: browser-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/.wrangler
          key: wrangler-browser-${{ runner.os }}-${{ steps.miniflare.outputs.version }}
      # On a miss, the browser is fetched with curl and unpacked with unzip (miniflare's own unpacking can stall on a runner) into the folder miniflare
      # looks in, then saved at once, so a job's later failure doesn't lose it. A failure here only leaves miniflare to download it itself.
      - id: browser-install
        if: steps.browser-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          version=$(grep -m1 -oE 'BROWSER_VERSION = "[0-9.]+"' node_modules/miniflare/dist/src/index.js | grep -oE '[0-9.]+')
          directory="$HOME/.cache/.wrangler/chrome/linux-$version"
          curl --fail --silent --show-error --retry 5 --retry-all-errors --connect-timeout 20 --max-time 300 --output "$RUNNER_TEMP/chrome.zip" "https://storage.googleapis.com/chrome-for-testing-public/$version/linux64/chrome-linux64.zip"
          mkdir -p "$directory"
          unzip -q "$RUNNER_TEMP/chrome.zip" -d "$directory"
          test -x "$directory/chrome-linux64/chrome"
      - if: steps.browser-install.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/.wrangler
          key: wrangler-browser-${{ runner.os }}-${{ steps.miniflare.outputs.version }}
      - run: npm run preview:start -- --reset
      - run: npm run preview:stop
      - if: needs.changes.outputs.is_preview_snapshot_ready == 'false'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.PREVIEW_SNAPSHOT_PATHS }}
          key: ${{ needs.changes.outputs.preview_snapshot_key }}

  # The merge group's measured pages into main's cache once its commit is main, so the next merge group skips what this one measured.
  # Nothing waits for it.
  main-measured:
    name: Measured pages for main
    needs: changes
    if: github.event_name == 'push' && needs.changes.outputs.is_checked_in_queue == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout: scripts
      - uses: actions/cache/restore@v4
        with:
          path: .wrangler/layout-sweep-measured.json
          key: layout-sweep-measured-${{ github.sha }}
          restore-keys: layout-sweep-measured-
      - env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          run_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$HEAD_SHA&event=merge_group&per_page=20" --jq '[.workflow_runs[] | select(.path == ".github/workflows/check.yml" and .conclusion == "success")][0].id // empty')"
          if [ -z "$run_id" ]; then echo "No passed merge group run for this commit: nothing to add."; exit 0; fi
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --pattern 'layout-sweep-measured-*' --dir measured || echo "That run kept no measured pages (it measured none)."
          node scripts/merge-measured.mjs .wrangler/layout-sweep-measured.json measured
      - uses: actions/cache/save@v4
        with:
          path: .wrangler/layout-sweep-measured.json
          key: layout-sweep-measured-${{ github.sha }}

  check:
    name: Tests and typecheck
    needs: [changes, tests, repeat-new-tests, typecheck, contract-grid, pattern-rules, engines, seed, layout, sweep, docs-tests]
    # Also when a job failed, so the required check fails instead of being skipped.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout: scripts
      # Over the ceiling fails the run however its jobs did, and names the slowest (scripts/ci-time-limit.mjs). The verdict still prints below.
      - id: time-limit
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-time-limit.mjs --check
      - env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          IS_CHECKED_IN_QUEUE: ${{ needs.changes.outputs.is_checked_in_queue }}
          IS_CODE_CHANGED: ${{ needs.changes.outputs.is_code_changed }}
          IS_ENGINES_CHANGED: ${{ needs.changes.outputs.is_engines_changed }}
          TESTS_RESULT: ${{ needs.tests.result }}
          REPEAT_RESULT: ${{ needs.repeat-new-tests.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          CONTRACT_GRID_RESULT: ${{ needs.contract-grid.result }}
          PATTERN_RULES_RESULT: ${{ needs.pattern-rules.result }}
          ENGINES_RESULT: ${{ needs.engines.result }}
          SEED_RESULT: ${{ needs.seed.result }}
          LAYOUT_RESULT: ${{ needs.layout.result }}
          SWEEP_RESULT: ${{ needs.sweep.result }}
          EVENT_NAME: ${{ github.event_name }}
          DOCS_TESTS_RESULT: ${{ needs.docs-tests.result }}
          TIME_LIMIT_OUTCOME: ${{ steps.time-limit.outcome }}
        run: |
          if [ "$TIME_LIMIT_OUTCOME" = failure ]; then echo "This run went over CI's 5:00 ceiling: see the step before this one."; exit 1; fi
          echo "What changed: $CHANGES_RESULT (code changed: $IS_CODE_CHANGED, engine code changed: $IS_ENGINES_CHANGED). Tests: $TESTS_RESULT. New tests ten times: $REPEAT_RESULT. Typecheck: $TYPECHECK_RESULT. Engine exports: $ENGINES_RESULT. Preview test data: $SEED_RESULT. Layout check: $LAYOUT_RESULT. Every screen: $SWEEP_RESULT. Docs tests: $DOCS_TESTS_RESULT."
          if [ "$CHANGES_RESULT" != success ]; then exit 1; fi
          # A push to main the merge queue already checked: its merge group's run passed on exactly this commit.
          if [ "$IS_CHECKED_IN_QUEUE" = true ]; then echo "Checked in the merge queue: this commit passed there."; exit 0; fi
          # Engine exports passed, or was skipped because the pull request changed nothing it plays (a failure is never a skip).
          engines_ok=false
          if [ "$ENGINES_RESULT" = success ]; then engines_ok=true; fi
          if [ "$ENGINES_RESULT" = skipped ] && [ "$IS_ENGINES_CHANGED" = false ]; then engines_ok=true; fi
          # Contract grid passed, or didn't run (nothing it tries changed, or a push to main).
          if [ "$CONTRACT_GRID_RESULT" != success ] && [ "$CONTRACT_GRID_RESULT" != skipped ]; then exit 1; fi
          # Pattern rules passed, or didn't run (no code changed, or a push to main).
          if [ "$PATTERN_RULES_RESULT" != success ] && [ "$PATTERN_RULES_RESULT" != skipped ]; then exit 1; fi
          # New tests ten times passed, or didn't run (no test file changed, or not a pull request).
          if [ "$REPEAT_RESULT" != success ] && [ "$REPEAT_RESULT" != skipped ]; then exit 1; fi
          # In the merge queue Every screen must pass; elsewhere it doesn't run.
          sweep_ok=true
          if [ "$EVENT_NAME" = merge_group ]; then sweep_ok=false; if [ "$SWEEP_RESULT" = success ]; then sweep_ok=true; fi; fi
          if [ "$IS_CODE_CHANGED" = true ] && [ "$TESTS_RESULT" = success ] && [ "$TYPECHECK_RESULT" = success ] && [ "$engines_ok" = true ] && [ "$LAYOUT_RESULT" = success ] && [ "$sweep_ok" = true ]; then exit 0; fi
          if [ "$IS_CODE_CHANGED" = false ] && [ "$DOCS_TESTS_RESULT" = success ]; then exit 0; fi
          exit 1
