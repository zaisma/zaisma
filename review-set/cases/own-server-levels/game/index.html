<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Level Loader</title>
<style>body{margin:0;font-family:system-ui,sans-serif;background:#111;color:#eee;display:flex;flex-direction:column;align-items:center}canvas{background:#000;margin-top:12px}button{font:inherit;padding:8px 14px;margin:4px}</style>
</head>
<body>
<h1>Level Loader</h1>
<p id="level">Loading level…</p>
<script>
fetch("https://play.example.invalid/levels/1.json")
  .then((response) => response.json())
  .then((level) => { document.getElementById("level").textContent = `Level ${level.number}: ${level.name}`; })
  .catch(() => { document.getElementById("level").textContent = "Level 1: The Beginning (offline)"; });
</script>
</body>
</html>
