<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Normandy 1944 Map Quiz</title>
<style>body{margin:0;font-family:system-ui,sans-serif;background:#111;color:#eee;display:flex;flex-direction:column;align-items:center}canvas{background:#000;margin-top:12px}button{font:inherit;padding:8px 14px;margin:4px}</style>
</head>
<body>
<h1>Normandy 1944 Map Quiz</h1>
<p>A history quiz about the D-Day landings.</p>
<p id="question"></p>
<div id="options"></div>
<p>Score: <span id="score">0</span></p>
<script>
const questions = [
  {
    "question": "Which beach did the Canadian forces land on?",
    "options": [
      "Juno",
      "Omaha",
      "Utah"
    ],
    "answer": 0
  },
  {
    "question": "What was the date of the landings?",
    "options": [
      "June 6, 1944",
      "May 8, 1945",
      "December 7, 1941"
    ],
    "answer": 0
  },
  {
    "question": "Which flag flew over the Allied headquarters?",
    "options": [
      "Several: the US, UK and Canadian flags",
      "Only one",
      "None"
    ],
    "answer": 0
  }
];
let index = 0, score = 0;
function show() {
  const current = questions[index % questions.length];
  document.getElementById("question").textContent = current.question;
  const options = document.getElementById("options");
  options.innerHTML = "";
  current.options.forEach((option, i) => {
    const button = document.createElement("button");
    button.textContent = option;
    button.onclick = () => { if (i === current.answer) score++; document.getElementById("score").textContent = score; index++; show(); };
    options.append(button);
  });
}
show();
</script>
</body>
</html>
