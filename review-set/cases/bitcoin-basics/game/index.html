<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bitcoin Basics</title>
<style>body{margin:0;font-family:system-ui,sans-serif;background:#111;color:#eee;display:flex;flex-direction:column;align-items:center}canvas{background:#000;margin-top:12px}button{font:inherit;padding:8px 14px;margin:4px}</style>
</head>
<body>
<h1>Bitcoin Basics</h1>
<p>A short course on Bitcoin.</p>
<p id="question"></p>
<div id="options"></div>
<p>Score: <span id="score">0</span></p>
<script>
const questions = [
  {
    "question": "How many bitcoin will ever exist?",
    "options": [
      "21 million",
      "100 million",
      "No limit"
    ],
    "answer": 0
  },
  {
    "question": "What is a satoshi?",
    "options": [
      "One hundred millionth of a bitcoin",
      "A mining pool",
      "A wallet"
    ],
    "answer": 0
  },
  {
    "question": "Who should know your seed phrase?",
    "options": [
      "Only you",
      "Support staff",
      "Any website"
    ],
    "answer": 0
  }
];
let index = 0, score = 0;
function show() {
  const current = questions[index % questions.length];
  document.getElementById("question").textContent = current.question;
  const options = document.getElementById("options");
  options.innerHTML = "";
  current.options.forEach((option, i) => {
    const button = document.createElement("button");
    button.textContent = option;
    button.onclick = () => { if (i === current.answer) score++; document.getElementById("score").textContent = score; index++; show(); };
    options.append(button);
  });
}
show();
</script>
</body>
</html>
