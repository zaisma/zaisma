<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pass the Orb</title>
<style>body{margin:0;font-family:system-ui,sans-serif;background:#111;color:#eee;display:flex;flex-direction:column;align-items:center}canvas{background:#000;margin-top:12px}button{font:inherit;padding:8px 14px;margin:4px}</style>
</head>
<body>
<h1>Pass the Orb</h1>
<p id="status">Waiting for a friend…</p>
<button id="start">Start</button>
<script>
document.getElementById("start").onclick = () => {
  const connection = new RTCPeerConnection();
  const channel = connection.createDataChannel("orb");
  channel.onopen = () => (document.getElementById("status").textContent = "Connected");
  document.getElementById("status").textContent = "Ready to connect";
};
</script>
</body>
</html>
