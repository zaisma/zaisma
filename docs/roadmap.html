<title>Zaisma Roadmap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a roadmap ledger. A sticky bar says where you are and jumps between phases and tracks; phases fold, items are one line until tapped. Dark first (the metal logo lives on dark). */
:root {
  --bg: #16161a; --surface: #1e1e23; --line: #2d2d34; --fg: #ececef; --muted: #9b9ba6;
  --steel: #b9c6d8; --julius: #e2b45e; --gleb: #6cc6c0;
  --done: #74c393; --doing: #e2b45e; --next: #86aef0; --planned: #8a8a96;
  --display: "Jost", "Futura", "Century Gothic", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --logo-metal: block; --logo-black: none;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f3f4f6; --surface: #ffffff; --line: #dcdde2; --fg: #17171b; --muted: #5d5e68;
    --steel: #3d4f6b; --julius: #9a6a10; --gleb: #1d7f79;
    --done: #1f8a4c; --doing: #9a6a10; --next: #2f5fb3; --planned: #6c6c78;
    --logo-metal: none; --logo-black: block; color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f3f4f6; --surface: #ffffff; --line: #dcdde2; --fg: #17171b; --muted: #5d5e68;
  --steel: #3d4f6b; --julius: #9a6a10; --gleb: #1d7f79;
  --done: #1f8a4c; --doing: #9a6a10; --next: #2f5fb3; --planned: #6c6c78;
  --logo-metal: none; --logo-black: block; color-scheme: light;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 15px/1.55 var(--body); }
.wrap { max-width: 1080px; margin: 0 auto; padding-inline: 20px; padding-block: 28px 64px; display: grid; gap: 32px; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; letter-spacing: 0.01em; }
a { color: var(--steel); }
:focus-visible { outline: 2px solid var(--steel); outline-offset: 2px; border-radius: 4px; }

header { display: grid; gap: 14px; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand img { height: 26px; width: auto; }
.logo-metal { display: var(--logo-metal); }
.logo-black { display: var(--logo-black); }
.brand span { font: 600 14px var(--display); color: var(--muted); padding-left: 12px; border-left: 1px solid var(--line); }
h1 { font-size: clamp(30px, 5vw, 44px); font-weight: 600; }
.now { font-size: 16px; max-width: 70ch; display: grid; gap: 8px; }
.now h2 { font-size: 15px; color: var(--steel); font-weight: 600; }
.now p { margin: 0; color: var(--muted); }
.now ol { margin: 0; padding-left: 22px; display: grid; gap: 4px; }
.now ol a { color: var(--fg); text-decoration-color: var(--line); text-underline-offset: 3px; }
.now ol a:hover { text-decoration-color: var(--steel); }
.now ol .project { color: var(--muted); font-size: 14px; }
li.flash { box-shadow: inset 3px 0 0 var(--steel); }

.beta { display: grid; gap: 8px; max-width: 560px; }
.beta-label { display: flex; justify-content: space-between; gap: 12px; font: 500 13px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.meter { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--steel); border-radius: 99px; }

.bar { position: sticky; top: 0; z-index: 5; margin-inline: -20px; padding: 10px 20px; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
.where { font: 600 15px var(--display); display: flex; gap: 8px; align-items: baseline; min-width: 0; white-space: nowrap; overflow: hidden; }
.where .p { color: var(--fg); }
.where .g { color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
.where .sep { color: var(--muted); }
.pills { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-inline: -20px; padding-inline: 20px; }
.pills::-webkit-scrollbar { display: none; }
.pill { flex: none; display: inline-flex; gap: 7px; align-items: center; font: 500 13px var(--body); padding: 4px 11px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); text-decoration: none; white-space: nowrap; }
.pill .c { font: 500 12px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.pill:hover { border-color: var(--steel); }
.pill.here { border-color: var(--steel); box-shadow: inset 0 0 0 1px var(--steel); }
/* The track row floats under the bar, so showing or hiding it never moves the page (moving it made the bar flip back and forth at phase edges). */
.pills.tracks { position: absolute; top: 100%; left: 0; right: 0; margin: 0; padding: 8px 20px; background: inherit; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.pills.tracks .pill { background: transparent; }

.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.controls .lbl { font: 500 13px var(--body); color: var(--muted); margin-right: 4px; }
.chip { font: 500 13px var(--body); padding: 6px 12px; border-radius: 99px; border: 1px solid var(--line); background: transparent; color: var(--fg); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }

details.phase { border: 1px solid var(--line); border-radius: 12px; background: color-mix(in srgb, var(--surface) 40%, transparent); scroll-margin-top: 126px; }
details.phase > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 16px; align-items: center; padding: 16px 18px; }
details.phase > summary::-webkit-details-marker { display: none; }
summary .k { font: 500 13px var(--mono); color: var(--muted); }
summary h2 { font-size: 24px; font-weight: 600; }
summary .prog { display: grid; gap: 6px; justify-items: end; min-width: 120px; }
summary .prog .c { font: 500 12px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
summary .track { width: 120px; height: 4px; background: var(--line); border-radius: 9px; overflow: hidden; }
summary .track i { display: block; height: 100%; background: var(--done); }
summary .chev { grid-column: 2; grid-row: 1; justify-self: end; color: var(--muted); transition: transform .2s; }
details.phase[open] > summary .chev { transform: rotate(90deg); }
summary .name-wrap { display: grid; gap: 2px; }
.phase-body { display: grid; gap: 16px; padding: 0 18px 18px; }
.phase-body > p { margin: 0; max-width: 70ch; color: var(--muted); }
.phase-body > p strong { color: var(--fg); font-weight: 600; }
.group { display: grid; gap: 8px; scroll-margin-top: 126px; }
.group h3 { font: 600 17px var(--display); margin-top: 6px; display: flex; gap: 10px; align-items: baseline; }
.group h3 .c { font: 500 12px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.group > p { margin: 0; color: var(--muted); font-size: 14px; max-width: 70ch; }

ul.items { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); overflow: hidden; }
ul.items li { display: grid; grid-template-columns: 84px minmax(0, 1fr) auto; gap: 14px; align-items: start; padding: 10px 14px; border-top: 1px solid var(--line); }
ul.items li:first-child { border-top: 0; }
ul.items li.has-more { cursor: pointer; }
ul.items li.has-more:hover { background: color-mix(in srgb, var(--steel) 6%, transparent); }
.status { font: 500 12px var(--mono); padding-top: 2px; display: flex; align-items: center; gap: 7px; color: var(--muted); }
.status::before { content: ""; width: 9px; height: 9px; border-radius: 50%; flex: none; border: 2px solid var(--planned); }
.s-done .status { color: var(--done); } .s-done .status::before { background: var(--done); border-color: var(--done); }
.s-doing .status { color: var(--doing); } .s-doing .status::before { border-color: var(--doing); background: linear-gradient(90deg, var(--doing) 50%, transparent 50%); }
.s-next .status { color: var(--next); } .s-next .status::before { border-color: var(--next); }
.s-idea .status::before { border-style: dashed; }
.s-done .name { color: var(--muted); }
.name { font-weight: 500; background: none; border: 0; padding: 0; color: inherit; font: inherit; font-weight: 500; text-align: left; cursor: inherit; }
.note { color: var(--muted); font-size: 14px; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
li.open .note, body.full .note { -webkit-line-clamp: unset; display: block; }
li .needs.later { display: none; }
li.open .needs.later, body.full .needs.later { display: block; }
.tags { display: flex; gap: 6px; padding-top: 1px; }
.tag { font: 500 12px var(--mono); padding: 1px 7px; border-radius: 5px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.tag.must { color: var(--fg); border-color: var(--fg); }
.tag.settled { color: var(--next); border-color: var(--next); }
.tag.julius { color: var(--julius); border-color: var(--julius); }
.tag.gleb { color: var(--gleb); border-color: var(--gleb); }
.needs { font-size: 13px; color: var(--muted); margin-top: 3px; }
.needs .lbl { font: 500 12px var(--mono); margin-right: 4px; }
.needs .open { color: var(--fg); }
.needs .met { text-decoration: line-through; }
.empty { padding: 14px; color: var(--muted); font-size: 14px; }

.legend { display: flex; flex-wrap: wrap; gap: 16px; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
footer { color: var(--muted); font-size: 13px; border-top: 1px solid var(--line); padding-top: 16px; }
.error { padding: 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }

@media (max-width: 560px) {
  .wrap { padding-inline: 16px; }
  .bar, .pills { margin-inline: -16px; padding-inline: 16px; }
  .pills.tracks { margin: 0; }
  ul.items li { grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; }
  ul.items li > div:first-of-type { grid-column: 1 / -1; grid-row: 2; }
  .phase-body { padding: 0 12px 14px; }
  summary h2 { font-size: 20px; }
  summary .prog { min-width: 0; }
  summary .track { width: 72px; }
}
@media (prefers-reduced-motion: no-preference) {
  .meter i, summary .track i { transition: width .4s ease; }
}
</style>

<div class="wrap">
  <header>
    <div class="brand">
      <img class="logo-metal" src="zaisma-wordmark-metal.svg" alt="Zaisma">
      <img class="logo-black" src="zaisma-wordmark-black.svg" alt="Zaisma">
      <span>Roadmap</span>
    </div>
    <h1>From safe hosting to a full game platform</h1>
    <div class="now" id="now"><p>Loading the roadmap…</p></div>
    <div class="beta" id="beta" hidden>
      <div class="beta-label"><span>Beta progress: must items in Phase 1</span><span id="beta-count"></span></div>
      <div class="meter"><i id="beta-bar" style="width:0"></i></div>
    </div>
  </header>

  <div class="bar">
    <div class="where" aria-live="polite"><span class="p" id="where-p">Roadmap</span><span class="sep" id="where-sep" hidden>›</span><span class="g" id="where-g"></span></div>
    <nav class="pills" id="pills" aria-label="Phases"></nav>
    <nav class="pills tracks" id="tracks" aria-label="Tracks in this phase" hidden></nav>
  </div>

  <div class="controls" role="group" aria-label="Filter items">
    <span class="lbl">Show</span>
    <button class="chip" id="f-all" type="button" aria-pressed="true">Everything</button>
    <button class="chip" id="f-must" type="button" aria-pressed="false">Must items only</button>
    <button class="chip" id="f-julius" type="button" aria-pressed="false">Julius's to-dos</button>
    <button class="chip" id="f-gleb" type="button" aria-pressed="false">Gleb's to-dos</button>
    <button class="chip" id="f-open" type="button" aria-pressed="false">Hide done</button>
    <button class="chip" id="f-full" type="button" aria-pressed="false">Full notes</button>
  </div>

  <main id="phases" style="display:grid;gap:14px"></main>

  <div class="legend" aria-label="Status key">
    <span class="s-done"><span class="status">done</span></span>
    <span class="s-doing"><span class="status">doing</span></span>
    <span class="s-next"><span class="status">next</span></span>
    <span class="s-planned"><span class="status">planned</span></span>
    <span class="s-idea"><span class="status">idea</span></span>
  </div>
  <footer>Built from <code>docs/ROADMAP.md</code> in <a href="https://github.com/zaisma/zaisma/blob/main/docs/ROADMAP.md" target="_blank" rel="noopener">github.com/zaisma/zaisma</a>, the one source of truth. The how behind each item is in <a href="https://github.com/zaisma/zaisma/blob/main/docs/DECISIONS.md" target="_blank" rel="noopener">DECISIONS.md</a>.</footer>
</div>

<script>
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
// Inline markdown: **bold**, `code`, [text](url).
const md = (s) => esc(s)
  .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
  .replace(/`(.+?)`/g, "<code>$1</code>")
  .replace(/\[(.+?)\]\((.+?)\)/g, (m, t, u) => /^https?:/.test(u) ? `<a href="${u}" target="_blank" rel="noopener">${t}</a>` : t);

function parse(text) {
  const phases = []; const now = []; let isNow = false; let phase = null; let group = null; let header = null;
  for (const raw of text.split("\n")) {
    const line = raw.trim();
    const h2 = line.match(/^## (.+)$/);
    // "## Now": what's being built next, in order, as a numbered list with lines around it.
    if (h2) isNow = h2[1] === "Now";
    if (isNow) { if (line && !h2) now.push(line); continue; }
    if (h2) {
      const m = h2[1].match(/^Phase (\d+): (.+?)(?: \((.+)\))?$/);
      if (m) phase = { num: m[1], title: m[2], tagline: m[3] || "", intro: [], groups: [] };
      else if (/parked/i.test(h2[1])) phase = { num: "", title: h2[1], intro: [], groups: [] };
      else { phase = null; continue; }
      phases.push(phase); group = { title: "", intro: [], items: [] }; phase.groups.push(group); header = null; continue;
    }
    if (!phase) continue;
    const h3 = line.match(/^### (.+)$/);
    if (h3) { group = { title: h3[1], intro: [], items: [] }; phase.groups.push(group); header = null; continue; }
    if (line.startsWith("|")) {
      const cells = line.slice(1, -1).split("|").map((c) => c.trim());
      if (cells.every((c) => /^-+$/.test(c))) continue;
      if (!header) { header = cells.map((c) => c.toLowerCase()); continue; }
      const get = (k) => cells[header.indexOf(k)] ?? "";
      let name = get("item");
      const owner = (name.match(/^(Julius|Gleb):\s*/) || [])[1] || "";
      name = name.replace(/^(Julius|Gleb):\s*/, ""); name = name.charAt(0).toUpperCase() + name.slice(1);
      group.items.push({ status: get("status") || "planned", isSettled: get("settled").toLowerCase() === "yes", must: /must/i.test(get("must/nice")), nice: /nice/i.test(get("must/nice")), name, note: get("notes"), owner, needs: get("needs").split(",").map((n) => n.trim()).filter(Boolean) });
      continue;
    }
    header = null;
    if (line) (group.items.length || group.title ? group.intro : phase.intro).push(line);
  }
  for (const p of phases) p.groups = p.groups.filter((g) => g.items.length || g.intro.length);
  return { now, phases };
}

let data = null;
let filter = "all"; let hideDone = false; let full = false;
const opened = new Set();
const slug = (t) => t.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
const phaseId = (p) => p.num !== "" ? `phase-${p.num}` : "parked";
const phaseLabel = (p) => p.num !== "" ? `Phase ${p.num}: ${p.title}` : p.title;
const groupId = (p, g) => `${phaseId(p)}-${slug(g.title.replace(/\(.*?\)/g, ""))}`;
const shortTitle = (t) => t.replace(/\s*\(.*?\)\s*/g, "").trim();
const countDone = (items) => `${items.filter((i) => i.status === "done").length}/${items.length}`;
const itemId = (name) => `item-${slug(name)}`;

/** The Now section: its numbered lines as a list whose entries jump to their rows, the rest as paragraphs. */
function nowHtml(lines) {
  let html = ""; let list = "";
  const flush = () => { if (list) html += `<ol>${list}</ol>`; list = ""; };
  for (const line of lines) {
    const entry = line.match(/^\d+\.\s+(.+?)(?:\s+\((.+)\))?$/);
    if (!entry) { flush(); html += `<p>${md(line)}</p>`; continue; }
    list += `<li><a href="#${itemId(entry[1])}">${md(entry[1])}</a>${entry[2] ? ` <span class="project">${esc(entry[2])}</span>` : ""}</li>`;
  }
  flush();
  return lines.length ? `<h2>Now</h2>${html}` : "";
}

function visible(item) {
  if (hideDone && item.status === "done") return false;
  if (filter === "must") return item.must;
  if (filter === "julius") return item.owner === "Julius";
  if (filter === "gleb") return item.owner === "Gleb";
  return true;
}

function render() {
  const { now, phases } = data;
  document.getElementById("now").innerHTML = nowHtml(now);

  const p1 = phases.find((p) => p.num === "1");
  if (p1) {
    const must = p1.groups.flatMap((g) => g.items).filter((i) => i.must);
    const done = must.filter((i) => i.status === "done").length;
    document.getElementById("beta").hidden = false;
    document.getElementById("beta-count").textContent = `${done} of ${must.length}`;
    document.getElementById("beta-bar").style.width = `${must.length ? (done / must.length) * 100 : 0}%`;
  }

  const current = phases.find((p) => p.num !== "" && p.groups.flatMap((g) => g.items).some((i) => i.status !== "done"));
  if (!opened.size && current) opened.add(phaseId(current));

  document.getElementById("pills").innerHTML = phases.map((p) => {
    const items = p.groups.flatMap((g) => g.items);
    return `<a class="pill" href="#${phaseId(p)}" data-for="${phaseId(p)}">${p.num !== "" ? `${p.num} · ` : ""}${esc(p.title)}<span class="c">${p.num !== "" ? countDone(items) : items.length}</span></a>`;
  }).join("");

  const statusOf = new Map(phases.flatMap((p) => p.groups.flatMap((g) => g.items)).map((i) => [i.name.toLowerCase(), i.status]));
  const needsHtml = (i) => {
    if (!i.needs.length) return "";
    const parts = i.needs.map((n) => {
      const shown = n.replace(/^(Julius|Gleb):\s*/, "");
      const met = statusOf.get(shown.toLowerCase()) === "done";
      return { met, html: `<span class="${met ? "met" : "open"}">${md(shown.charAt(0).toUpperCase() + shown.slice(1))}</span>` };
    });
    // Needs still waiting stay in view; needs already met show with the full note.
    const waiting = i.status !== "done" && parts.some((x) => !x.met);
    return `<div class="needs${waiting ? "" : " later"}"><span class="lbl">Needs</span>${parts.map((x) => x.html).join(", ")}</div>`;
  };

  document.getElementById("phases").innerHTML = phases.map((p) => {
    const id = phaseId(p);
    const all = p.groups.flatMap((g) => g.items);
    const groups = p.groups.map((g) => {
      const items = g.items.filter(visible);
      if (g.items.length && !items.length) return "";
      const rows = items.map((i) => {
        const more = i.note || i.needs.length;
        return `<li id="${itemId(i.name)}" class="s-${esc(i.status)}${more ? " has-more" : ""}">
        <span class="status">${esc(i.status)}</span>
        <div>${more ? `<button class="name" type="button" aria-expanded="false">${md(i.name)}</button>` : `<div class="name">${md(i.name)}</div>`}${i.note ? `<div class="note">${md(i.note)}</div>` : ""}${needsHtml(i)}</div>
        <div class="tags">${i.isSettled && i.status !== "done" ? '<span class="tag settled" title="Talked through with Julius: ready to build">Settled</span>' : ""}${i.owner ? `<span class="tag ${i.owner.toLowerCase()}">${i.owner}</span>` : ""}${i.must ? '<span class="tag must">Must</span>' : i.nice ? '<span class="tag">Nice</span>' : ""}</div>
      </li>`;
      }).join("");
      const gid = g.title ? groupId(p, g) : "";
      return `<div class="group"${gid ? ` id="${gid}" data-title="${esc(shortTitle(g.title))}"` : ""}>${g.title ? `<h3>${esc(shortTitle(g.title))}<span class="c">${countDone(g.items)} done</span></h3>` : ""}${g.intro.map((t) => `<p>${md(t)}</p>`).join("")}${rows ? `<ul class="items">${rows}</ul>` : ""}</div>`;
    }).join("");
    const shown = groups.trim() ? groups : `<div class="empty">Nothing here matches this filter.</div>`;
    const done = all.filter((i) => i.status === "done").length;
    return `<details class="phase" id="${id}" data-label="${esc(phaseLabel(p))}"${opened.has(id) ? " open" : ""}>
      <summary>
        <span class="name-wrap"><span class="k">${p.num !== "" ? `Phase ${p.num}` : "Not planned"}</span><h2>${esc(p.title)}</h2></span>
        <span class="prog">${p.num !== "" ? `<span class="track"><i style="width:${all.length ? (done / all.length) * 100 : 0}%"></i></span><span class="c">${done}/${all.length} done</span>` : `<span class="c">${all.length} ideas</span>`}</span>
      </summary>
      <div class="phase-body">${p.intro.map((t) => `<p>${md(t)}</p>`).join("")}${shown}</div>
    </details>`;
  }).join("");

  for (const d of document.querySelectorAll("details.phase")) d.addEventListener("toggle", () => {
    d.open ? opened.add(d.id) : opened.delete(d.id);
    spy();
  });
  spy();
}

const smooth = () => !matchMedia("(prefers-reduced-motion: reduce)").matches;
// A quick eased scroll (the browser's own smooth scroll is slow and can't be tuned): 250 to 450 ms by distance, easing out.
// Scrolling with the wheel or a finger takes over at once.
let gliding = 0;
function glide(to) {
  const from = scrollY, dist = to - from;
  if (!smooth() || Math.abs(dist) < 2) { scrollTo(0, to); return; }
  const ms = Math.min(450, 250 + Math.abs(dist) / 20), start = performance.now(), run = ++gliding;
  const step = (now) => {
    if (run !== gliding) return;
    const t = Math.min(1, (now - start) / ms);
    scrollTo(0, from + dist * (1 - Math.pow(1 - t, 3)));
    if (t < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
for (const ev of ["wheel", "touchstart", "keydown"]) addEventListener(ev, () => { gliding++; }, { passive: true });
// Slide a pill row sideways so the highlighted pill is in view, without touching the page's own scroll.
function reveal(row, pill) {
  const r = row.getBoundingClientRect(), b = pill.getBoundingClientRect();
  if (b.left >= r.left && b.right <= r.right) return;
  row.scrollTo({ left: row.scrollLeft + b.left - r.left - (r.width - b.width) / 2, behavior: smooth() ? "smooth" : "auto" });
}

// Open a phase (and scroll to a phase or track) from a link, the pills or the address.
function go(id) {
  const el = document.getElementById(id); if (!el) return;
  const phase = el.closest("details.phase"); if (phase && !phase.open) phase.open = true;
  // Land the phase or track just above the line the bar reads from, so the bar names what you jumped to.
  const top = el.getBoundingClientRect().top + scrollY - document.querySelector(".bar").offsetHeight - LINE + 8;
  glide(Math.max(0, top));
}

// Which phase and track sit under the sticky bar: shown in the bar, with that phase's tracks as jumps.
/** How far below the bar the "you are here" line sits: room for the floating track row. */
const LINE = 56;
let lastPhase = null;
function spy() {
  const line = document.querySelector(".bar").getBoundingClientRect().bottom + LINE;
  let phase = null, group = null;
  for (const d of document.querySelectorAll("details.phase")) if (d.getBoundingClientRect().top <= line) phase = d;
  if (phase?.open) for (const g of phase.querySelectorAll(".group[id]")) if (g.getBoundingClientRect().top <= line) group = g;
  document.getElementById("where-p").textContent = phase ? phase.dataset.label : "Roadmap";
  document.getElementById("where-sep").hidden = !group;
  document.getElementById("where-g").textContent = group ? group.dataset.title : "";
  for (const a of document.querySelectorAll("#pills .pill")) {
    const here = a.dataset.for === phase?.id;
    a.classList.toggle("here", here);
    if (here && lastPhase !== phase.id) reveal(a.parentElement, a);
  }
  const tracks = document.getElementById("tracks");
  const groups = phase?.open ? [...phase.querySelectorAll(".group[id]")] : [];
  if ((phase?.id ?? null) !== lastPhase || tracks.childElementCount !== groups.length) {
    tracks.innerHTML = groups.map((g) => `<a class="pill" href="#${g.id}" data-for="${g.id}">${esc(g.dataset.title)}<span class="c">${esc(g.querySelector("h3 .c").textContent.replace(" done", ""))}</span></a>`).join("");
  }
  tracks.hidden = !groups.length;
  for (const a of tracks.querySelectorAll(".pill")) {
    const here = a.dataset.for === group?.id;
    if (here && !a.classList.contains("here")) reveal(tracks, a);
    a.classList.toggle("here", here);
  }
  lastPhase = phase?.id ?? null;
}
let ticking = false;
addEventListener("scroll", () => { if (!ticking) { ticking = true; requestAnimationFrame(() => { ticking = false; spy(); }); } }, { passive: true });

document.addEventListener("click", (e) => {
  const link = e.target.closest('.bar a[href^="#"], .now a[href^="#"]');
  if (link) {
    e.preventDefault();
    const id = link.getAttribute("href").slice(1);
    // An item filtered out of view is shown again before jumping to it.
    if (!document.getElementById(id) && (filter !== "all" || hideDone)) { hideDone = false; document.getElementById("f-open").setAttribute("aria-pressed", "false"); setFilter("all"); }
    history.replaceState(null, "", `#${id}`);
    go(id);
    const row = document.getElementById(id);
    if (row?.matches("li")) { row.classList.add("open", "flash"); setTimeout(() => row.classList.remove("flash"), 1600); }
    return;
  }
  const row = e.target.closest("li.has-more");
  if (row && !e.target.closest("a")) {
    const open = row.classList.toggle("open");
    row.querySelector("button.name")?.setAttribute("aria-expanded", String(open));
  }
});

function setFilter(next) {
  filter = next;
  for (const [id, f] of [["f-all", "all"], ["f-must", "must"], ["f-julius", "julius"], ["f-gleb", "gleb"]]) document.getElementById(id).setAttribute("aria-pressed", String(f === filter));
  try { localStorage.setItem("roadmap-filter", filter); } catch {}
  render();
}
document.getElementById("f-all").onclick = () => setFilter("all");
document.getElementById("f-must").onclick = () => setFilter("must");
document.getElementById("f-julius").onclick = () => setFilter("julius");
document.getElementById("f-gleb").onclick = () => setFilter("gleb");
document.getElementById("f-open").onclick = (e) => {
  hideDone = !hideDone; e.currentTarget.setAttribute("aria-pressed", String(hideDone));
  try { localStorage.setItem("roadmap-hide-done", hideDone ? "1" : ""); } catch {}
  render();
};
document.getElementById("f-full").onclick = (e) => {
  full = !full; e.currentTarget.setAttribute("aria-pressed", String(full));
  document.body.classList.toggle("full", full);
  try { localStorage.setItem("roadmap-full", full ? "1" : ""); } catch {}
  spy();
};

// The page can't reach GitHub (the artifact host blocks it), so it reads the ROADMAP.md published beside it.
fetch("ROADMAP.md", { cache: "no-store" })
  .then((r) => { if (!r.ok) throw new Error(r.status); return r.text(); })
  .then((text) => {
    data = parse(text);
    try {
      const f = localStorage.getItem("roadmap-filter"); if (f && ["all", "must", "julius", "gleb"].includes(f)) filter = f;
      hideDone = localStorage.getItem("roadmap-hide-done") === "1";
      full = localStorage.getItem("roadmap-full") === "1";
    } catch {}
    for (const [id, f] of [["f-all", "all"], ["f-must", "must"], ["f-julius", "julius"], ["f-gleb", "gleb"]]) document.getElementById(id).setAttribute("aria-pressed", String(f === filter));
    document.getElementById("f-open").setAttribute("aria-pressed", String(hideDone));
    document.getElementById("f-full").setAttribute("aria-pressed", String(full));
    document.body.classList.toggle("full", full);
    render();
    if (location.hash) go(location.hash.slice(1));
  })
  .catch(() => {
    document.getElementById("now").innerHTML = "";
    document.getElementById("phases").innerHTML = '<div class="error">The roadmap file didn\'t load. Reload the page, or read it on GitHub: <a href="https://github.com/zaisma/zaisma/blob/main/docs/ROADMAP.md" target="_blank" rel="noopener">docs/ROADMAP.md</a>.</div>';
  });
</script>
