<!doctype html>

  q(".s-disc").forEach(function (e, i) { draw(e, 4300 + i * 160, 640); });

  A(q(".s-handle")[0], [{ opacity: 0, transform: "scaleY(.02)" }, { opacity: 1, transform: "scaleY(1)" }], { delay: 4550, duration: 480 });
